[package]
name = "agentrecall"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Iakov Filimonov"]
description = "AgentRecall private shared-memory MCP service backed by embedded DuckDB"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
base64 = "=0.23.0"
chrono = { version = "=0.4.42", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
duckdb = { version = "=1.20001.0", features = ["bundled", "chrono"] }
fastembed = { version = "=7.8.0", default-features = false, features = ["onnx", "fancy-regex", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
hex = "0.4"
hmac = "=0.13.0"
http = "1.3"
rand = "=0.10.1"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "=1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "=0.6.8", features = ["limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "=1.18.1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
